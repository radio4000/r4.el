name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.1"
          - "30.1"
          - snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mpv and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv ffmpeg

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Compile
        run: make compile

      - name: Test
        run: make test

      - name: Lint
        run: make lint
